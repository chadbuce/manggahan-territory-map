<!DOCTYPE html>
<html lang="en">
<head>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Segoe UI, Roboto, sans-serif; }
body { background:#f5f5f5; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
header { background:#2c3e50; color:#fff; padding:10px 12px; flex-shrink:0; }
header h1 { font-size:0.95rem; font-weight:600; }
header p { font-size:0.7rem; opacity:.8; margin-top:2px; }
.tabs { display:flex; background:#fff; border-bottom:1px solid #ddd; flex-shrink:0; }
.tab { flex:1; padding:10px 6px; text-align:center; font-weight:600; cursor:pointer; border-bottom:3px solid transparent; font-size:0.85rem; }
.tab.active { border-bottom-color:#27ae60; color:#27ae60; background:#f0f8f4; }
.map-container { flex:1; overflow:hidden; position:relative; background:#e9e9e9; }
.map-viewport { width:100%; height:100%; overflow:hidden; cursor:grab; }
.map-viewport:active { cursor:grabbing; }
.map-wrapper { position:absolute; transform-origin:center center; will-change:transform; width:100%; height:100%; }
.map-layer { position:relative; display:block; width:100%; height:100%; }
.map-svg-img { display:block; width:100%; height:100%; pointer-events:none; }
.map-interactive { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; }
.territory-zone { pointer-events:auto; cursor:pointer; fill:transparent; stroke:transparent; }
body.has-selection .territory-zone { fill:#888; mix-blend-mode:saturation; fill-opacity:1; }
body.has-selection .territory-zone.selected { fill:transparent; mix-blend-mode:normal; }
/* overlay copies of street names / numbers: hidden because the base image already draws them (prevents double vision) */
.ov-label { visibility:hidden; pointer-events:none; }
.weather-widget {
  position:absolute; bottom:calc(74px + 50px + 8px); left:12px; width:170px;
  background:rgba(255,255,255,0.75); backdrop-filter:blur(8px); border-radius:10px;
  padding:8px 10px; box-shadow:0 2px 6px rgba(0,0,0,0.1); z-index:25;
  font-size:0.75rem; color:#333; max-height:35vh; overflow-y:auto;
}
.weather-widget h4 { font-size:0.72rem; color:#2c3e50; margin-bottom:2px; font-weight:600; border-bottom:1px solid rgba(0,0,0,0.08); padding-bottom:2px; }
.weather-date { font-size:0.65rem; color:#666; margin-bottom:4px; }
.weather-temp { font-size:1.1rem; font-weight:700; color:#e67e22; margin:2px 0; line-height:1.2; }
.weather-desc { font-size:0.7rem; color:#555; margin-bottom:4px; line-height:1.2; }
.weather-detail { font-size:0.68rem; color:#666; line-height:1.3; }
.weather-forecast-title { font-size:0.7rem; font-weight:600; color:#2c3e50; margin:5px 0 2px; padding-top:4px; border-top:1px solid rgba(0,0,0,0.08); }
.forecast-row { display:flex; justify-content:space-between; align-items:center; font-size:0.65rem; padding:2px 0; border-bottom:1px solid rgba(0,0,0,0.04); gap:3px; }
.forecast-day { font-weight:600; flex-shrink:0; width:32px; }
.forecast-rain { text-align:center; flex-shrink:0; font-size:0.6rem; }
.forecast-emoji { flex-shrink:0; font-size:0.7rem; }
.forecast-temp { color:#e67e22; text-align:right; flex:1; font-size:0.65rem; }
.weather-loading { font-style:italic; color:#999; padding:6px 0; font-size:0.7rem; }
.controls { position:absolute; top:50%; right:10px; transform:translateY(-50%); display:flex; flex-direction:column; gap:6px; z-index:20; }
.btn, .fullscreen-btn, .camera-btn, .qr-btn, .marker-toggle { width:42px; height:42px; border-radius:50%; border:none; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,0.18); font-size:1rem; cursor:pointer; }
.fullscreen-btn { font-size:0.9rem; margin-bottom:2px; }
.camera-btn { font-size:1.05rem; margin-bottom:2px; }
.camera-btn:active { transform:scale(.92); }
.qr-btn { font-size:1.05rem; margin-top:2px; align-self:center; }
.marker-toggle { font-size:1.05rem; margin-top:5px; align-self:center; }
.btn-row { display:flex; gap:5px; justify-content:center; }
.reset-btn { width:90px; border-radius:21px; font-weight:bold; color:#27ae60; align-self:flex-end; font-size:0.75rem; }
.info-panel {
  position:absolute; bottom:calc(12px + 50px); left:12px; width:170px; background:#fff; border-radius:10px;
  padding:10px 12px; box-shadow:0 3px 10px rgba(0,0,0,0.2);
  transform:translateY(120%); transition:transform 0.25s ease; z-index:20;
}
.info-panel.show { transform:translateY(0); }
.info-panel h3 { font-size:0.85rem; color:#27ae60; margin-bottom:4px; }
.info-panel p { font-size:0.72rem; color:#555; margin:2px 0; line-height:1.3; }
.info-panel .color-swatch { display:inline-block; width:11px; height:11px; border-radius:2px; border:1px solid #999; vertical-align:middle; margin-right:5px; flex-shrink:0; }
.info-panel .sel-list { max-height:110px; overflow-y:auto; margin-top:4px; }
.info-panel .sel-item { display:flex; align-items:center; gap:5px; padding:2px 0; border-bottom:1px dotted #eee; font-size:0.72rem; color:#333; }
.close-btn { position:absolute; top:6px; right:8px; font-size:0.95rem; cursor:pointer; color:#888; }
.camera-toast {
  position:absolute; top:60px; left:50%; transform:translateX(-50%);
  background:rgba(44,62,80,.92); color:#fff; padding:8px 16px; border-radius:20px;
  font-size:0.75rem; z-index:60; opacity:0; transition:opacity .3s; pointer-events:none;
}
.camera-toast.show { opacity:1; }
.qr-modal { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:#fff; padding:18px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.35); z-index:80; text-align:center; display:none; }
.qr-modal.show { display:block; }
.qr-modal img { width:200px; height:200px; display:block; margin:0 auto 6px; }
.qr-modal p { font-size:0.78rem; color:#444; margin-bottom:8px; }
.qr-modal .close-qr { background:#95a5a6; color:#fff; border:none; padding:6px 16px; border-radius:14px; cursor:pointer; font-size:0.75rem; }
.map-marker { position:absolute; transform:translate(-50%,-50%); width:26px; height:26px; z-index:35; cursor:grab; touch-action:none; display:none; user-select:none; }
.map-marker.visible { display:block; }
.map-marker.dragging { cursor:grabbing; z-index:60; }
.map-marker .m-label { position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%); background:rgba(255,255,255,0.88); border:1px solid rgba(0,0,0,0.15); border-radius:8px; padding:4px 8px; min-width:100px; text-align:center; box-shadow:0 1px 5px rgba(0,0,0,0.25); backdrop-filter:blur(4px); white-space:nowrap; }
.map-marker .m-title { font-size:0.65rem; font-weight:700; color:#c0392b; margin-bottom:2px; }
.map-marker .m-loc { font-size:0.62rem; color:#333; width:100%; border:none; background:transparent; text-align:center; outline:none; font-family:inherit; }
.map-marker .m-circle { width:20px; height:20px; border-radius:50%; background:#fff; border:3px solid #c0392b; box-shadow:0 1px 5px rgba(0,0,0,0.35); }
@media (max-width:480px) {
  header { padding:8px 10px; } header h1 { font-size:0.88rem; }
  .tab { padding:8px 4px; font-size:0.8rem; }
  .weather-widget { width:155px; padding:6px 8px; left:8px; bottom:calc(68px + 50px + 6px); max-height:32vh; }
  .info-panel { width:155px; padding:8px 10px; left:8px; bottom:calc(10px + 50px); }
  .info-panel h3 { font-size:0.8rem; } .info-panel p, .info-panel .sel-item { font-size:0.7rem; }
  .controls { right:8px; gap:5px; }
  .btn, .fullscreen-btn, .camera-btn, .qr-btn, .marker-toggle { width:40px; height:40px; font-size:0.95rem; }
  .reset-btn { width:82px; font-size:0.7rem; }
}
</style>

<body>

  <h1>Manggahan Congregation Territory Map</h1>

<div class="qr-modal" id="qrModal"><p>Scan to open this map</p><img id="qrImg" alt="QR code" /><br/><button class="close-qr" id="qrClose">Close</button></div>
<script>

  '#6bb99f':{n:10, s:'Obanic, Don Fabian Ext'},

  '#7e888a':{n:25, s:'Commonwealth, Litex Rd'},
  '#989fed':{n:26, s:'Soliven, Litex Rd'},
  '#68b6f8':{n:27, s:'Litex Rd, West'},

  '#11c2b5':{n:36, s:'Kapatiran, North-East'},
  '#4e02fc':{n:37, s:'Creek, Far North-East'},
  '#295f59':{n:38, s:'Kapatiran, Mid-East'},
  '#fdfa89':{n:39, s:'Kapatiran Ext, Mid'},
  '#01ffa9':{n:40, s:'Calachuchi, Abris'},
  '#476694':{n:41, s:'Pinagkaisa, West'},
  '#fc2300':{n:42, s:'Pinagkaisa, Central'},
  '#f26b7c':{n:43, s:'Pinagkaisa, East'},
  '#15d5c7':{n:44, s:'Paulia, Kapatiran Ext'},
  '#0109fb':{n:45, s:'Aloe-Vera, Paulia'},
  '#ffff03':{n:46, s:'Creek, Far East'},
  '#c2534a':{n:47, s:'Bougainvillea, Upper'},
  '#fe004d':{n:48, s:'Bougainvillea, Jasmin'},
  '#5f3293':{n:49, s:'Cana, Jasmin'},
  '#ab02ef':{n:50, s:'Aloe-Vera, Central South'},
  '#f8f6df':{n:51, s:'Jasmin, South-East'},
  '#fecb9e':{n:52, s:'Banaba, Far South-East'}
};
const TER_INFO = {};
Object.keys(COLOR_MAP).forEach(hex => { const d = COLOR_MAP[hex]; TER_INFO['Ter '+d.n] = { color: hex.toUpperCase(), streets: d.s, num: d.n }; });
function normalizeColor(c){ if(!c) return null; c = String(c).trim().toLowerCase(); if(c.startsWith('#')){ let h=c.slice(1); if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; if(h.length===6) return '#'+h; } return null; }
function getInheritedFill(el){
  let node = el;
  while(node && node.getAttribute){
    const style = node.getAttribute('style');
    if(style){ const m = style.match(/fill\s*:\s*([^;}"']+)/i); if(m){ const n=normalizeColor(m[1]); if(n) return n; if(m[1].trim().toLowerCase()==='none') return 'none'; } }
    const f = node.getAttribute('fill');
    if(f){ const n=normalizeColor(f); if(n) return n; if(f.trim().toLowerCase()==='none') return 'none'; }
    node = node.parentElement;
  }
  return null;
}

/* ============ SELECTION + INFO PANEL ============ */
const selectedSet = new Set();
function onTerritoryClick(e){
  e.stopPropagation();
  const ter = e.currentTarget.dataset.ter;
  if(selectedSet.has(ter)) selectedSet.delete(ter); else selectedSet.add(ter);
  applySelection();
}
function applySelection(){
  document.body.classList.toggle('has-selection', selectedSet.size > 0);
  document.querySelectorAll('.territory-zone').forEach(z => {
    if(selectedSet.has(z.dataset.ter)) z.classList.add('selected'); else z.classList.remove('selected');
  });
  updateInfoPanel();
}
function clearSelection(){ selectedSet.clear(); applySelection(); }
function markerNote(){
  const l = markerLabel[activeMap];
  return (markerVisible[activeMap] && markerState[activeMap] && l)
    ? `<p>📍 Meeting: <b>${l.replace(/</g,'&lt;')}</b></p>` : '';
}
function updateInfoPanel(){
  const panel=document.getElementById('infoPanel'), title=document.getElementById('ipTitle'), body=document.getElementById('ipBody');
  if(selectedSet.size===0){ panel.classList.remove('show'); return; }
  panel.classList.add('show');
  const sorted=[...selectedSet].sort((a,b)=>TER_INFO[a].num-TER_INFO[b].num);
  if(sorted.length===1){
    const t=TER_INFO[sorted[0]];
    title.textContent=sorted[0];
    body.innerHTML=`<p>Streets: ${t.streets}</p><p><span class="color-swatch" style="background:${t.color}"></span>Selected</p>${markerNote()}`;
  } else {
    title.textContent=sorted.length+' Territories Selected';
    let html='<div class="sel-list">';
    sorted.forEach(id=>{ const t=TER_INFO[id]; html+=`<div class="sel-item"><span class="color-swatch" style="background:${t.color}"></span><b>${id}</b></div>`; });
    html+='</div>'; html+=markerNote(); body.innerHTML=html;
  }
}

/* ============ BUILD INTERACTIVE OVERLAY ============ */
async function buildTapOverlay(svgUrl, layerEl){
  try {
    const res = await fetch(svgUrl, {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text = await res.text();
    const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
    const imported = document.importNode(doc.documentElement, true);
    imported.setAttribute('class','map-interactive');
    imported.setAttribute('preserveAspectRatio','xMidYMid meet');
    imported.style.position='absolute'; imported.style.top='0'; imported.style.left='0';
    imported.style.width='100%'; imported.style.height='100%';
    imported.removeAttribute('width'); imported.removeAttribute('height');
    imported.querySelectorAll('path, polygon, polyline, rect, circle, ellipse, line').forEach(sh => {
      const fill = getInheritedFill(sh);
      const match = fill ? COLOR_MAP[fill] : null;
      if(match){
        sh.classList.add('territory-zone');
        sh.dataset.ter='Ter '+match.n; sh.dataset.streets=match.s; sh.dataset.color=fill.toUpperCase();
        sh.removeAttribute('fill'); sh.removeAttribute('stroke');
        sh.style.removeProperty('fill');
        sh.style.removeProperty('stroke');
        sh.style.removeProperty('fill-opacity');
        sh.style.removeProperty('stroke-width');
        sh.style.pointerEvents='auto';
        sh.addEventListener('click', onTerritoryClick);
      } else if(sh.tagName.toLowerCase()==='path' && (fill==='#ffffff' || fill==='#fff' || fill==='#000000' || fill==='#000')){
        sh.classList.add('ov-label');   // numbers/street outlines: base image already draws them
      } else {
        sh.style.display='none';
      }
    });
    imported.querySelectorAll('text, tspan').forEach(el => el.classList.add('ov-label'));
    imported.querySelectorAll('image, use').forEach(el => { el.style.display='none'; });
    layerEl.appendChild(imported);
    collectMarkerData(imported, svgUrl.indexOf('manggahan')>=0 ? 'manggahan' : 'payatas');
  } catch(err){ console.warn('Tap overlay could not load for '+svgUrl+':', err.message); }
}

/* ============ CAMERA CAPTURE → SHARE ============ */
function showToast(msg){
  const t = document.getElementById('cameraToast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function loadImage(src){
  return new Promise((res, rej) => { const i = new Image(); i.crossOrigin='anonymous'; i.onload=()=>res(i); i.onerror=rej; i.src=src; });
}
function rrect(c, x, y, w, h, r){
  c.beginPath(); c.moveTo(x+r, y);
  c.arcTo(x+w, y, x+w, y+h, r); c.arcTo(x+w, y+h, x, y+h, r);
  c.arcTo(x, y+h, x, y, r); c.arcTo(x, y, x+w, y, r); c.closePath();
}
async function captureSelected(){
  if(selectedSet.size === 0){ showToast('Tap one or more territories first'); return; }
  showToast('📷 Capturing…');
  try {
    const layer = layers[activeMap].el;
    const svgUrl = layer.querySelector('img.map-svg-img').src;
    const overlay = layer.querySelector('svg.map-interactive');
    const vb = overlay.viewBox.baseVal;
    const SCALE = 3;
    const mapW = Math.min(2400, Math.round(vb.width*SCALE));
    const mapH = Math.round(mapW * vb.height / vb.width);
    const HEADER = Math.round(mapW * 0.19);
    const canvas = document.createElement('canvas');
    canvas.width = mapW; canvas.height = mapH + HEADER;
    const ctx = canvas.getContext('2d');
    // 3-line header
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, mapW, HEADER);
    ctx.fillStyle = '#2c3e50'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `bold ${Math.round(HEADER*0.26)}px Segoe UI, Roboto, sans-serif`;
    ctx.fillText('Ito Po Ang Gagawin Ngayon', mapW/2, HEADER*0.24);
    ctx.font = `${Math.round(HEADER*0.19)}px Segoe UI, Roboto, sans-serif`;
    const dateStr = new Date().toLocaleDateString('en-US', {timeZone:'Asia/Manila', month:'2-digit', day:'2-digit', year:'numeric'});
    ctx.fillText(dateStr, mapW/2, HEADER*0.52);
    const terList = [...selectedSet].sort((a,b)=>TER_INFO[a].num-TER_INFO[b].num).join(', ');
    ctx.font = `${Math.round(HEADER*0.16)}px Segoe UI, Roboto, sans-serif`;
    ctx.fillStyle = '#27ae60';
    ctx.fillText('Territories: ' + terList, mapW/2, HEADER*0.80);
    // white background behind map
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, HEADER, mapW, mapH);
    // step 1: whole map in grayscale
    const baseImg = await loadImage(svgUrl);
    try { await baseImg.decode(); } catch(e){}
    ctx.filter = 'grayscale(1)';
    ctx.drawImage(baseImg, 0, HEADER, mapW, mapH);
    ctx.filter = 'none';
    // step 2: repaint selected zones in original color
    const selClone = overlay.cloneNode(true);
    selClone.setAttribute('viewBox', `0 0 ${vb.width} ${vb.height}`);
    selClone.setAttribute('preserveAspectRatio', 'none');
    selClone.setAttribute('width', mapW); selClone.setAttribute('height', mapH);
    selClone.querySelectorAll('path:not(.territory-zone), text, tspan').forEach(el => { el.style.display='none'; });
    selClone.querySelectorAll('.territory-zone').forEach(z => {
      if(z.classList.contains('selected')){ z.style.display=''; z.style.fill = z.dataset.color; z.style.mixBlendMode='normal'; }
      else { z.style.display='none'; }
    });
    const selUrl = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(selClone)], {type:'image/svg+xml;charset=utf-8'}));
    const selImg = await loadImage(selUrl);
    ctx.drawImage(selImg, 0, HEADER, mapW, mapH);
    URL.revokeObjectURL(selUrl);
    // step 3: redraw numbers + street names on top (serialized SVG has no page CSS, so .ov-label is still visible here)
    const txtClone = overlay.cloneNode(true);
    txtClone.setAttribute('viewBox', `0 0 ${vb.width} ${vb.height}`);
    txtClone.setAttribute('preserveAspectRatio', 'none');
    txtClone.setAttribute('width', mapW); txtClone.setAttribute('height', mapH);
    txtClone.querySelectorAll('.territory-zone').forEach(z => { z.style.display='none'; });
    const txtUrl = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(txtClone)], {type:'image/svg+xml;charset=utf-8'}));
    const txtImg = await loadImage(txtUrl);
    ctx.drawImage(txtImg, 0, HEADER, mapW, mapH);
    URL.revokeObjectURL(txtUrl);
    // step 4: meeting-place pin + its street-corner label panel
    const mk = markerState[activeMap];
    if(markerVisible[activeMap] && mk){
      const k = mapW/800;                                   // screen-px -> canvas-px
      const px = mk.x/vb.width*mapW, py = HEADER + mk.y/vb.height*mapH, r = 10*k;
      ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2);
      ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.lineWidth = 3*k; ctx.strokeStyle = '#c0392b'; ctx.stroke();
      const loc = (markerLabel[activeMap]||'').trim();
      if(loc){
        const titleTxt = '📍 Meeting Place';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = `700 ${10.4*k}px Segoe UI, Roboto, sans-serif`;
        const tw = ctx.measureText(titleTxt).width;
        ctx.font = `${9.9*k}px Segoe UI, Roboto, sans-serif`;
        const lw = ctx.measureText(loc).width;
        const bw = Math.min(mapW-8*k, Math.max(100*k, tw+16*k, lw+16*k)), bh = 35*k;
        const bx = Math.max(4*k, Math.min(mapW-bw-4*k, px-bw/2));
        let by = py - r - 6*k - bh;
        if(by < HEADER + 4*k) by = py + r + 6*k;            // not enough room above -> put below the pin
        rrect(ctx, bx, by, bw, bh, 8*k);
        ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.fill();
        ctx.lineWidth = k; ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.stroke();
        ctx.font = `700 ${10.4*k}px Segoe UI, Roboto, sans-serif`;
        ctx.fillStyle = '#c0392b'; ctx.fillText(titleTxt, bx+bw/2, by+10*k);
        ctx.font = `${9.9*k}px Segoe UI, Roboto, sans-serif`;
        ctx.fillStyle = '#333333'; ctx.fillText(loc, bx+bw/2, by+25*k);
      }
    }
    // share
    const pngBlob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    const file = new File([pngBlob], 'selected-territories.png', {type:'image/png'});
    showToast('Opening share…');
    try {
      if(navigator.share){
        await navigator.share({files:[file], title:'Selected Territories', text:'Selected Territories'});
        showToast('✅ Shared');
      } else {
        showToast('Share not supported on this browser — use Chrome');
      }
    } catch(e){ showToast('Share cancelled or unavailable'); }
  } catch(err){
    console.error(err);
    showToast('Capture failed — try again');
  }
}
document.getElementById('btnCamera').addEventListener('click', captureSelected);

/* ============ LIVE DATE + WEATHER ============ */
function updateDate(){
  const options={weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'Asia/Manila'};
  document.getElementById('liveDate').textContent = new Date().toLocaleDateString('en-PH', options);
}
updateDate(); setInterval(updateDate, 60000);
const WEATHER_LAT=14.6744, WEATHER_LON=121.0819;
function getDayName(ds){ const d=new Date(ds); return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getUTCDay()]; }
function getWeatherDescription(code){
  const m={0:'☀️ Clear',1:'🌤️ Mostly Clear',2:'⛅ Partly Cloudy',3:'☁️ Overcast',45:'🌫️ Fog',48:'🌫️ Rime Fog',51:'🌧️ Lt Drizzle',53:'🌧️ Mod Drizzle',55:'🌧️ Dense Drizzle',61:'🌦️ Lt Rain',63:'🌧️ Mod Rain',65:'🌧️ Hvy Rain',71:'❄️ Lt Snow',73:'❄️ Mod Snow',75:'❄️ Hvy Snow',80:'🌦️ Lt Showers',81:'🌧️ Mod Showers',82:'⛈️ Hvy Showers',95:'⛈️ T-Storm',96:'⛈️ Storm+Hail',99:'⛈️ Storm+Hail'};
  return m[code]||'❓ Unknown';
}
async function fetchWeather(){
  const content=document.getElementById('weatherContent');
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${WEATHER_LAT}&longitude=${WEATHER_LON}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=5&timezone=Asia%2FManila`;
    const data=await (await fetch(url)).json();
    const temp=Math.round(data.current.temperature_2m), humidity=data.current.relative_humidity_2m, wind=Math.round(data.current.wind_speed_10m);
    const desc=getWeatherDescription(data.current.weather_code);
    let fh='';
    for(let i=1;i<=4;i++){
      const day=getDayName(data.daily.time[i]), high=Math.round(data.daily.temperature_2m_max[i]), low=Math.round(data.daily.temperature_2m_min[i]);
      const rain=data.daily.precipitation_probability_max[i]||0, emoji=getWeatherDescription(data.daily.weather_code[i]).split(' ')[0];
      fh+=`<div class="forecast-row"><span class="forecast-day">${day}</span><span class="forecast-rain">☔${rain}%</span><span class="forecast-emoji">${emoji}</span><span class="forecast-temp">${low}°/${high}°</span></div>`;
    }
    content.innerHTML=`<div class="weather-temp">${temp}°C</div><div class="weather-desc">${desc}</div><div class="weather-detail">💧 ${humidity}% &nbsp; 🌬️ ${wind}km/h</div><div class="weather-forecast-title">📅 Forecast</div>${fh}`;
  }catch(err){ content.innerHTML=`<span style="color:#e74c3c;">Unavailable</span>`; }
}
fetchWeather(); setInterval(fetchWeather, 900000);

/* ============ MAP VIEW: TABS, ZOOM, ROTATE, PAN ============ */
const layers = {
  manggahan:{el:document.getElementById('manggahanLayer'), subtitle:'Manggahan Area — Territories 1–23'},
  payatas:{el:document.getElementById('payatasLayer'), subtitle:'Payatas Area — Territories 24–52'}
};
let activeMap='manggahan', scale=1, posX=0, posY=0, rotation=0;
const wrapper=document.getElementById('mapWrapper'), viewport=document.getElementById('mapViewport');
function updateTransform(){ wrapper.style.transform=`translate(${posX}px, ${posY}px) scale(${scale}) rotate(${rotation}deg)`; applyMarkerTransform(); }
function resetView(){ scale=1; posX=0; posY=0; rotation=0; updateTransform(); clearSelection(); }
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    activeMap=tab.dataset.map;
    layers.manggahan.el.style.display=activeMap==='manggahan'?'block':'none';
    layers.payatas.el.style.display=activeMap==='payatas'?'block':'none';
    document.getElementById('mapSubtitle').textContent=layers[activeMap].subtitle;
    resetView();
    loadMarker(); renderMarker();
  });
});
document.getElementById('zoomIn').onclick=()=>{ scale=Math.min(scale*1.4,6); updateTransform(); };
document.getElementById('zoomOut').onclick=()=>{ scale=Math.max(scale/1.4,0.6); updateTransform(); };
document.getElementById('rotLeft').onclick=()=>{ rotation-=15; updateTransform(); };
document.getElementById('rotRight').onclick=()=>{ rotation+=15; updateTransform(); };
document.getElementById('resetBtn').onclick=resetView;
document.getElementById('fullscreenBtn').onclick=()=>{
  if(!document.fullscreenElement){ (document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen)?.call(document.documentElement); }
  else { (document.exitFullscreen||document.webkitExitFullscreen)?.call(document); }
};
let drag=null;
viewport.addEventListener('mousedown', e=>{ drag={x:e.clientX-posX, y:e.clientY-posY}; });
window.addEventListener('mousemove', e=>{ if(!drag) return; posX=e.clientX-drag.x; posY=e.clientY-drag.y; updateTransform(); });
window.addEventListener('mouseup', ()=>drag=null);
let touchState=null;
function getDist(t1,t2){ return Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY); }
function getAngle(t1,t2){ return Math.atan2(t2.clientY-t1.clientY, t2.clientX-t1.clientX)*180/Math.PI; }
viewport.addEventListener('touchstart', e=>{
  if(e.touches.length===1){ touchState={mode:'pan',x:e.touches[0].clientX-posX,y:e.touches[0].clientY-posY}; }
  else if(e.touches.length===2){ const [t1,t2]=[e.touches[0],e.touches[1]]; touchState={mode:'multi',dist:getDist(t1,t2),angle:getAngle(t1,t2),startScale:scale,startRot:rotation}; }
},{passive:true});
viewport.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(!touchState) return;
  if(touchState.mode==='pan'){ posX=e.touches[0].clientX-touchState.x; posY=e.touches[0].clientY-touchState.y; updateTransform(); }
  else if(touchState.mode==='multi' && e.touches.length===2){
    const [t1,t2]=[e.touches[0],e.touches[1]];
    scale=Math.max(0.6,Math.min(6,touchState.startScale*(getDist(t1,t2)/touchState.dist)));
    rotation=touchState.startRot+(getAngle(t1,t2)-touchState.angle);
    updateTransform();
  }
},{passive:false});
viewport.addEventListener('touchend', ()=>touchState=null);
document.getElementById('closeInfo').onclick=clearSelection;
// background click clears selection, but not after a pan-drag or a tap on the marker
let _down=null;
viewport.addEventListener('pointerdown', e=>{ _down={x:e.clientX,y:e.clientY}; });
viewport.addEventListener('click', e=>{
  if(_down && Math.hypot(e.clientX-_down.x, e.clientY-_down.y) > 6) return;
  if(e.target.closest('.territory-zone, .map-marker')) return;
  clearSelection();
});

/* ============ MEETING PLACE MARKER ============ */
const markerCorners = { manggahan: [], payatas: [] };
const markerStreets = { manggahan: [], payatas: [] };   // [{t, pts:[{x,y}...]}]
const markerState   = { manggahan: null, payatas: null };
const markerLabel   = { manggahan: '', payatas: '' };
const markerVisible = { manggahan: true, payatas: true };
const _marker = document.getElementById('mapMarker');
const _markerLoc = document.getElementById('markerLoc');
const _lsKey = () => 'meetingMarker_' + activeMap;

function saveMarker(){
  try { localStorage.setItem(_lsKey(), JSON.stringify({pos: markerState[activeMap], label: markerLabel[activeMap], vis: markerVisible[activeMap]})); } catch(e){}
}
function loadMarker(){
  try {
    const raw = localStorage.getItem(_lsKey()); if(!raw) return;
    const d = JSON.parse(raw);
    markerState[activeMap]   = (d.pos && isFinite(d.pos.x) && isFinite(d.pos.y)) ? d.pos : null;
    markerLabel[activeMap]   = d.label || '';
    markerVisible[activeMap] = d.vis !== false;
  } catch(e){}
}
function nearestCorner(x, y){
  const pts = markerCorners[activeMap];
  if(!pts || !pts.length) return {x, y};
  let best = pts[0], bd = Infinity;
  for(const p of pts){ const d=(p.x-x)**2+(p.y-y)**2; if(d<bd){ bd=d; best=p; } }
  return best;
}
function nearestStreetLabel(x, y){
  const best = {};
  (markerStreets[activeMap]||[]).forEach(s => {
    let d = Infinity;
    for(const p of s.pts){ const dd = Math.hypot(p.x-x, p.y-y); if(dd<d) d=dd; }
    if(!(s.t in best) || d<best[s.t]) best[s.t] = d;
  });
  const names = Object.entries(best).sort((a,b)=>a[1]-b[1]).slice(0,2).map(e=>e[0]);
  return names.length ? 'Corner ' + names.join(' & ') : '';
}
// size the label's text box to its content so the whole street text fits inside the panel
const _mctx = document.createElement('canvas').getContext('2d');
function fitLoc(){
  const cs = getComputedStyle(_markerLoc);
  _mctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  const t = _markerLoc.value || _markerLoc.placeholder;
  _markerLoc.style.width = Math.ceil(_mctx.measureText(t).width + 10) + 'px';
}
// wrapper pixels <-> SVG units (accounts for xMidYMid meet letterboxing)
function fitInfo(ov){
  const vb = ov.viewBox.baseVal, W = wrapper.offsetWidth||1, H = wrapper.offsetHeight||1;
  const s = Math.min(W/vb.width, H/vb.height);
  return {W, H, s, offX:(W-vb.width*s)/2, offY:(H-vb.height*s)/2};
}
function applyMarkerTransform(){   // keep pin upright and constant size at any zoom/rotation
  _marker.style.transform = `translate(-50%,-50%) rotate(${-rotation}deg) scale(${1/scale})`;
}
function renderMarker(){
  const ov = layers[activeMap].el.querySelector('svg.map-interactive');
  const pos = markerState[activeMap];
  if(!pos || !markerVisible[activeMap] || !ov){ _marker.classList.remove('visible'); return; }
  const f = fitInfo(ov);
  _marker.style.left = (f.offX + pos.x*f.s) + 'px';
  _marker.style.top  = (f.offY + pos.y*f.s) + 'px';
  _marker.classList.add('visible');
  applyMarkerTransform();
  if(document.activeElement !== _markerLoc) _markerLoc.value = markerLabel[activeMap] || '';
  fitLoc();
}
// screen point -> SVG point, by inverting the wrapper's translate/scale/rotate
function clientToSvg(cx, cy){
  const ov = layers[activeMap].el.querySelector('svg.map-interactive');
  if(!ov) return {x:0, y:0};
  const f = fitInfo(ov), vb = ov.viewBox.baseVal, vr = viewport.getBoundingClientRect();
  const dx = cx - vr.left - (f.W/2 + posX), dy = cy - vr.top - (f.H/2 + posY);
  const a = -rotation*Math.PI/180, c = Math.cos(a), s = Math.sin(a);
  const lx = f.W/2 + (dx*c - dy*s)/scale, ly = f.H/2 + (dx*s + dy*c)/scale;
  return { x: Math.max(0, Math.min(vb.width,  (lx-f.offX)/f.s)),
           y: Math.max(0, Math.min(vb.height, (ly-f.offY)/f.s)) };
}

let _dragging=false, _lastTap=0, _dragPos=null;
_marker.addEventListener('touchstart', e => e.stopPropagation(), {passive:true});
_marker.addEventListener('mousedown',  e => e.stopPropagation());
_marker.addEventListener('click',      e => e.stopPropagation());
_marker.addEventListener('pointerdown', e => {
  e.stopPropagation();
  if(e.target.id === 'markerLoc') return;
  const now = Date.now();
  if(now - _lastTap < 300){ markerVisible[activeMap]=false; saveMarker(); renderMarker(); updateInfoPanel(); return; }
  _lastTap = now; _dragging = true; _dragPos = null;
  _marker.classList.add('dragging'); _marker.setPointerCapture(e.pointerId);
});
_marker.addEventListener('pointermove', e => {
  if(!_dragging) return;
  _dragPos = clientToSvg(e.clientX, e.clientY);
  markerState[activeMap] = _dragPos; renderMarker();
});
function endDrag(){
  if(!_dragging) return;
  _dragging = false; _marker.classList.remove('dragging');
  if(!_dragPos) return;                                  // plain tap, nothing moved
  const sn = nearestCorner(_dragPos.x, _dragPos.y); _dragPos = null;
  markerState[activeMap] = sn;
  markerLabel[activeMap] = nearestStreetLabel(sn.x, sn.y) || markerLabel[activeMap];
  saveMarker(); renderMarker(); updateInfoPanel();
}
_marker.addEventListener('pointerup', endDrag);
_marker.addEventListener('pointercancel', endDrag);
_markerLoc.addEventListener('input',  () => { markerLabel[activeMap] = _markerLoc.value; fitLoc(); });
_markerLoc.addEventListener('change', () => { markerLabel[activeMap] = _markerLoc.value; saveMarker(); updateInfoPanel(); });

document.getElementById('markerToggle').addEventListener('click', () => {
  const show = !(markerVisible[activeMap] && markerState[activeMap]);
  markerVisible[activeMap] = show;
  if(show && !markerState[activeMap]){
    const ov = layers[activeMap].el.querySelector('svg.map-interactive');
    if(ov){
      const vb = ov.viewBox.baseVal;
      const sn = nearestCorner(vb.width/2, vb.height/2);
      markerState[activeMap] = sn; markerLabel[activeMap] = nearestStreetLabel(sn.x, sn.y);
    }
  }
  saveMarker(); renderMarker(); updateInfoPanel();
});
window.addEventListener('resize', renderMarker);

// collect corner points + street-name positions from the SVG (called from buildTapOverlay)
function collectMarkerData(imported, mapKey){
  try {
    const pts = [];
    imported.querySelectorAll('#Corner_Points circle').forEach(c => {
      const x = parseFloat(c.getAttribute('cx')), y = parseFloat(c.getAttribute('cy'));
      if(isFinite(x) && isFinite(y)) pts.push({x, y});
    });
    markerCorners[mapKey] = pts;

    const sts = []; let run = null;
    const flush = () => { if(run && run.t.length >= 3) sts.push(run); run = null; };
    imported.querySelectorAll('text').forEach(t => {
      const txt = (t.textContent||'').replace(/\s+/g,' ').trim();
      const tr  = t.getAttribute('transform') || '';
      const m   = tr.match(/translate\(\s*(-?[\d.]+)[\s,]+(-?[\d.]+)\s*\)/);
      const fs  = parseFloat(((t.getAttribute('style')||'').match(/font-size:\s*([\d.]+)/)||[])[1]) || 14;
      if(!m || !txt || fs > 20) return;                  // skip map title / blank spacer glyphs
      const x = +m[1], y = +m[2];
      if(txt.length === 1){                              // curved names: one <text> per letter
        const last = run && run.pts[run.pts.length-1];
        if(last && Math.hypot(x-last.x, y-last.y) < 22){ run.t += txt; run.pts.push({x,y}); }
        else { flush(); run = {t: txt, pts: [{x,y}]}; }
        return;
      }
      flush();
      if(txt[0] === '(') return;                         // "(PAYATAS AREA)"
      const rm = tr.match(/rotate\(\s*(-?[\d.]+)/);
      const a = (rm ? parseFloat(rm[1]) : 0) * Math.PI/180, len = txt.length*fs*0.72, p = [];
      for(let d=0; d<=len; d+=8) p.push({x: x+d*Math.cos(a), y: y+d*Math.sin(a)});
      sts.push({t: txt, pts: p});
    });
    flush();
    markerStreets[mapKey] = sts;
  } catch(e){ console.warn('collectMarkerData', e); }
}

/* ============ QR CODE ============ */
var _qrb = document.getElementById('qrBtn');
if(_qrb) _qrb.addEventListener('click', () => {
  var _qri = document.getElementById('qrImg');
  var _qrm = document.getElementById('qrModal');

Promise.all([
  buildTapOverlay('manggahan.svg', layers.manggahan.el),
  buildTapOverlay('payatas.svg',   layers.payatas.el)
]).then(() => { loadMarker(); renderMarker(); });
